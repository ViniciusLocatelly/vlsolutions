<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Aparelho da equipe | VLSolutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Pagina interna: marca este navegador como aparelho da equipe, para nao contar nas visitas do site.
     Aberta pelo botao "Nao contar este aparelho" do Sistema-VLS. Sem contador e sem Google Analytics aqui. -->
<style>
  :root { --ouro: #B7892D; --fundo: #0d0d0d; --cartao: #161616; --texto: #f2efe8; --fraco: #a39e93; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: var(--fundo); color: var(--texto); font-family: 'DM Sans', Arial, sans-serif; }
  .cartao { width: 100%; max-width: 440px; background: var(--cartao); border: 1px solid #2a2a2a; border-top: 3px solid var(--ouro);
    border-radius: 10px; padding: 32px 28px; text-align: center; }
  img { height: 44px; margin-bottom: 22px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 10px; }
  p { color: var(--fraco); font-size: 15px; line-height: 1.55; margin: 0 0 22px; }
  .selo { display: inline-block; font-size: 13px; padding: 4px 12px; border-radius: 99px; margin-bottom: 18px; border: 1px solid #3a3a3a; color: var(--fraco); }
  .selo.ok { border-color: var(--ouro); color: var(--ouro); }
  button, a.btn { display: block; width: 100%; padding: 13px; border-radius: 8px; font: 600 15px 'DM Sans', Arial, sans-serif; cursor: pointer;
    border: 1px solid var(--ouro); background: var(--ouro); color: #0d0d0d; text-decoration: none; margin-bottom: 10px; }
  button.sec, a.sec { background: transparent; color: var(--texto); border-color: #3a3a3a; }
  .rodape { font-size: 12px; color: #6f6b63; margin-top: 14px; }
</style>
</head>
<body>
<main class="cartao">
  <img src="/logo.png" alt="VLSolutions">
  <div id="selo" class="selo"></div>
  <h1 id="titulo"></h1>
  <p id="texto"></p>
  <div id="botoes"></div>
  <div class="rodape">A marca fica só neste navegador. Não guarda nome, IP nem dado pessoal.</div>
</main>
<script>
(function () {
  var URLS = ['https://vls-crm.vlsolutions.workers.dev/api/publico/site', 'https://crm.vlsolutions.com.br/api/publico/site'];
  var CHAVE = 'vls-equipe';
  var q = new URLSearchParams(location.search);
  var acao = q.get('acao');
  var volta = q.get('volta') || '';
  if (!/^https:\/\/(crm\.vlsolutions\.com\.br|vls-crm\.vlsolutions\.workers\.dev)\//.test(volta)) volta = '';
  var idPedido = /^[a-f0-9]{24}$/.test(q.get('id') || '') ? q.get('id') : '';
  var $ = function (id) { return document.getElementById(id); };

  function lerMarca() { try { return JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { return null; } }
  function novoId() { var a = new Uint8Array(12); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  function dataBR(iso) { try { return new Date(iso).toLocaleDateString('pt-BR'); } catch (e) { return ''; } }

  function avisar(evento, id) {
    var corpo = JSON.stringify({ e: evento, id: id });
    for (var i = 0; i < URLS.length; i++) {
      try { if (navigator.sendBeacon && navigator.sendBeacon(URLS[i], new Blob([corpo], { type: 'text/plain' }))) return; } catch (e) { /* tenta o proximo */ }
    }
  }

  function voltar(resultado, id) {
    if (!volta) return;
    var u = new URL(volta);
    u.searchParams.set('equipe', resultado);
    if (id) u.searchParams.set('eid', id);
    setTimeout(function () { location.replace(u.toString()); }, 1400);
  }

  function marcar() {
    var atual = lerMarca();
    var id = idPedido || (atual && atual.id) || novoId();
    try { localStorage.setItem(CHAVE, JSON.stringify({ id: id, em: new Date().toISOString() })); }
    catch (e) { mostrar('erro'); return; }
    avisar('equipe_marcar', id);
    mostrar('feito-marcar');
    voltar('marcado', id);
  }

  function desmarcar() {
    var atual = lerMarca();
    try { localStorage.removeItem(CHAVE); } catch (e) { /* nada guardado */ }
    if (atual && atual.id) avisar('equipe_desmarcar', atual.id);
    mostrar('feito-desmarcar');
    voltar('desmarcado');
  }

  function botao(texto, fn, sec) {
    var b = document.createElement('button');
    b.textContent = texto;
    if (sec) b.className = 'sec';
    b.onclick = fn;
    $('botoes').appendChild(b);
  }

  function mostrar(estado) {
    var m = lerMarca();
    $('botoes').innerHTML = '';
    $('selo').className = 'selo' + (m ? ' ok' : '');
    $('selo').textContent = m ? 'Aparelho da equipe' : 'Este aparelho conta nas visitas';
    if (estado === 'feito-marcar') {
      $('titulo').textContent = 'Pronto. Este aparelho não conta mais.';
      $('texto').textContent = 'Suas visitas a vlsolutions.com.br neste navegador ficam fora do contador do Sistema-VLS e do Google Analytics.' + (volta ? ' Voltando ao Sistema-VLS...' : '');
    } else if (estado === 'feito-desmarcar') {
      $('titulo').textContent = 'Este aparelho voltou a contar.';
      $('texto').textContent = 'As visitas deste navegador entram de novo nos números do site.' + (volta ? ' Voltando ao Sistema-VLS...' : '');
    } else if (estado === 'erro') {
      $('titulo').textContent = 'Não foi possível marcar este navegador.';
      $('texto').textContent = 'O navegador está bloqueando o armazenamento do site (aba anônima ou bloqueio de dados). Abra numa aba normal e tente de novo.';
    } else if (acao === 'desmarcar') {
      $('titulo').textContent = 'Voltar a contar este aparelho?';
      $('texto').textContent = 'As visitas deste navegador passam a entrar nos números do site.';
      botao('Voltar a contar', desmarcar);
    } else if (m && acao !== 'marcar') {
      $('titulo').textContent = 'Este aparelho não conta nas visitas.';
      $('texto').textContent = 'Marcado como aparelho da equipe em ' + dataBR(m.em) + '.';
      botao('Voltar a contar', desmarcar, true);
    } else {
      $('titulo').textContent = m ? 'Renovar a marca deste aparelho' : 'Não contar este aparelho';
      $('texto').textContent = 'Use em computadores e celulares da equipe VLSolutions, para nossas próprias visitas não distorcerem os números do site.';
      botao(m ? 'Confirmar renovação' : 'Confirmar: não contar este aparelho', marcar);
    }
    if (volta && !/^feito/.test(estado || '')) {
      var a = document.createElement('a');
      a.className = 'btn sec'; a.href = volta; a.textContent = 'Voltar ao Sistema-VLS sem mudar';
      $('botoes').appendChild(a);
    }
  }

  mostrar();
})();
</script>
</body>
</html>
